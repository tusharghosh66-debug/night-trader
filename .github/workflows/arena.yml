name: strategy-arena
# PRIMARY ENGINE IS NOW RENDER: `python arena.py serve` (1-min loop, 24/7).
# This workflow is a MANUAL-ONLY fallback (Run workflow button) — no cron, no
# self-chain, so it never trades concurrently with the Render service.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: strategy-arena
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one arena cycle (10 bots)
        run: python arena.py once
      - name: Commit updated state
        run: |
          git config user.name "strategy-arena-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "arena manual $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase
          git push

