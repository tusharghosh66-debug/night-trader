name: night-trader
# PRIMARY ENGINE IS NOW RENDER: `python serve_all.py` runs BOTH this bot and
# the Strategy Arena in one service (1-min loops, 24/7). This workflow is a
# MANUAL-ONLY fallback (Run workflow button) — no cron, no self-chain, so it
# never trades concurrently with the Render service.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: night-trader
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one trading cycle
        run: python bot.py once
      - name: Commit updated state
        run: |
          git config user.name "night-trader-bot"
          git config user.email "actions@github.com"
          git add state.json trades.csv report.md dashboard.html news.json
          git diff --cached --quiet || git commit -m "night-trader manual $(date -u +%FT%TZ) [skip ci][skip render]"
          git checkout -- decisions.log arena.log 2>/dev/null || true
          git pull --rebase
          git push
