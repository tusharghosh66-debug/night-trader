name: night-trader
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: night-trader
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one trading cycle
        run: python bot.py once
      - name: Commit updated state
        run: |
          git config user.name "night-trader-bot"
          git config user.email "actions@github.com"
          git add state.json news.json report.md dashboard.html trades.csv decisions.log backtest.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "cycle $(date -u +%FT%TZ) [skip ci]"
          git push
